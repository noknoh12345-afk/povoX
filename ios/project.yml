# XcodeGen の定義。`xcodegen generate` で PovoX.xcodeproj を作る(CI で毎回生成する)。
name: PovoX
options:
  bundleIdPrefix: jp.povox
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PovoX:
    type: application
    platform: iOS
    sources:
      - path: PovoX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.povox.app
        PRODUCT_NAME: povoX
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: PovoX/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: PovoX/Support/PovoX-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../core/include
        # Rust のエンジン(core/)を静的リンクする。先に
        # `cargo build --release --target aarch64-apple-ios` で libpovo_auto.a を作っておく。
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../core/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../core/target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: -lpovo_auto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
