# XcodeGen の定義。CI で `xcodegen generate` して PovoX.xcodeproj を作る。
# 先に用意するもの(CI がやる):
#   core を iOS 向けにビルドした静的ライブラリを RustLib/iphoneos/ と RustLib/iphonesimulator/ に置く、
#   Swift の型の生成(ios/Generated/povo_auto.swift ほか)
name: PovoX
options:
  bundleIdPrefix: jp.povox
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  PovoX:
    type: application
    platform: iOS
    sources:
      - path: PovoX
        excludes:
          - "Resources/**"
      - path: PovoX/Resources
        buildPhase: resources
      - path: Generated
        includes:
          - "*.swift"
    dependencies:
      - target: PovoXWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.povox.app
        PRODUCT_NAME: PovoX
        INFOPLIST_FILE: PovoX/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PovoX/Support/PovoX.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: PovoX/Support/PovoX-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        # Rust のエンジン(core/)は静的ライブラリ(.a)をパスで直接指定し、アプリ本体に組み込む。
        # `-lpovo_auto` で探させると同じ場所の .dylib が優先され、ビルドした Mac 上のファイルを
        # 読み込むアプリになって実機では起動した瞬間に落ちる(build-9/10 で起きた)。
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(inherited) $(PROJECT_DIR)/RustLib/iphoneos/libpovo_auto.a
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(inherited) $(PROJECT_DIR)/RustLib/iphonesimulator/libpovo_auto.a
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PovoXWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PovoXWidget
      - path: PovoX/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.povox.app.widget
        PRODUCT_NAME: PovoXWidget
        INFOPLIST_FILE: PovoXWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PovoXWidget/PovoXWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  PovoXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PovoXTests
    dependencies:
      - target: PovoX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.povox.app.tests
        # アプリのモジュールが Rust の C ヘッダーを読むので、テストからも見えるようにする
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
  PovoXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PovoXUITests
    dependencies:
      - target: PovoX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.povox.app.uitests
        TEST_TARGET_NAME: PovoX
schemes:
  PovoX:
    build:
      targets:
        PovoX: all
    test:
      config: Debug
      targets:
        - PovoXTests
        - PovoXUITests
