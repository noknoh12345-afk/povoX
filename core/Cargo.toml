[package]
name = "povo-auto"
version = "0.2.1"
edition = "2021"
description = "povoX(iOS)の中身: povo-core を使った残量取得・ルールの計画実行・安全装置つきエンジン(非公式)"
publish = false

[lib]
name = "povo_auto"
# staticlib: iOS アプリに静的リンク / lib: テスト。
# cdylib はここに入れない(入れると iOS 向けにも .dylib ができ、アプリがビルドした Mac 上の
# ファイルを参照して実機で起動直後に落ちる)。Swift の型を作るときだけ
# `cargo rustc --lib --crate-type cdylib` で作る。
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# povo-web / povo-android と同じコミットに固定する。
povo-core = { git = "https://github.com/uirooong/povo-core", rev = "d516db1147732124718630bedaadf5529e85b00a" }
# povo-core と同じ版の UniFFI(Swift の型を作る)。
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
# panic = "abort" にしない: UniFFI が FFI 境界で panic を受け止めるため。
