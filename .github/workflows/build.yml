name: Build & Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          rustc --version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Rust tests (mock, no network to povo)
        working-directory: core
        run: cargo test --lib

      - name: Swift bindings (UniFFI)
        working-directory: core
        run: |
          # Swift の型を作るときだけ、この Mac 向けの .dylib を作って読ませる(アプリには入れない)
          cargo build --bin uniffi-bindgen
          cargo rustc --lib --crate-type cdylib
          ./target/debug/uniffi-bindgen generate --library target/debug/libpovo_auto.dylib \
            --language swift --out-dir ../ios/Generated --crate povo_auto
          ls -la ../ios/Generated

      - name: Rust for iOS (static libraries, release)
        working-directory: core
        run: |
          # アプリに組み込む静的ライブラリ(.a)だけを作る。iOS 向けの .dylib は作らない。
          # 実機向けは、静的リンクのときに追加で要るシステムのライブラリも表示する。
          cargo rustc --lib --release --target aarch64-apple-ios --crate-type staticlib -- --print native-static-libs
          cargo rustc --lib --release --target aarch64-apple-ios-sim --crate-type staticlib
          mkdir -p ../ios/RustLib/iphoneos ../ios/RustLib/iphonesimulator
          cp target/aarch64-apple-ios/release/libpovo_auto.a ../ios/RustLib/iphoneos/
          cp target/aarch64-apple-ios-sim/release/libpovo_auto.a ../ios/RustLib/iphonesimulator/
          ls -lh ../ios/RustLib/*/libpovo_auto.a

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          cands = []
          for rt, devs in d.items():
              if "iOS" not in rt:
                  continue
              for x in devs:
                  n = x["name"]
                  score = 3 if re.fullmatch(r"iPhone 1[5-7]", n) else (2 if n.startswith("iPhone 1") and "Plus" not in n and "Max" not in n else (1 if n.startswith("iPhone") else 0))
                  if score:
                      cands.append((score, ver(rt), x["udid"], n, rt))
          cands.sort(reverse=True)
          print(cands[0][2])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork 5g --cellularMode active --cellularBars 4 --wifiBars 3 --batteryState discharging --batteryLevel 80 || true
          xcrun simctl list devices | grep "$UDID"

      - name: Test in simulator (unit + UI, screenshots)
        id: test
        continue-on-error: true
        working-directory: ios
        run: |
          mkdir -p ../ci/shots
          set +e
          TEST_RUNNER_SHOT_DIR="$GITHUB_WORKSPACE/ci/shots" xcodebuild test \
            -project PovoX.xcodeproj -scheme PovoX \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ../ci/TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            > ../ci/test.log 2>&1
          status=$?
          set -e
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" ../ci/test.log | tail -150 || true
          echo "xcodebuild test exit: $status"
          exit $status

      - name: Build device app (Release, unsigned)
        id: device
        working-directory: ios
        run: |
          set +e
          xcodebuild build -project PovoX.xcodeproj -scheme PovoX -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > ../ci/build-device.log 2>&1
          status=$?
          set -e
          grep -E "error:|\*\* BUILD" ../ci/build-device.log | tail -60 || true
          exit $status

      - name: Check device app (no files from the build Mac)
        id: macho_device
        run: |
          set -o pipefail
          # 実機で起動直後に落ちる原因(ビルドした Mac 上のライブラリを読み込む)をここで止める
          python3 tools/check-macho.py --platform ios --expect-plugins 1 \
            ios/build/device/Build/Products/Release-iphoneos/PovoX.app | tee ci/macho-device.txt

      - name: Package IPAs
        working-directory: ios
        run: |
          APP=build/device/Build/Products/Release-iphoneos/PovoX.app
          test -d "$APP"
          ls "$APP" "$APP/PlugIns" || true
          test -d "$APP/Metadata.appintents" && echo "App Intents metadata: OK" || echo "::warning::App Intents metadata not found"
          # 署名ツールが App Group を引き継げるよう、権限(entitlements)を仮の署名で埋め込む
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          if [ -d Payload/PovoX.app/PlugIns/PovoXWidget.appex ]; then
            codesign -f -s - --entitlements PovoXWidget/PovoXWidget.entitlements Payload/PovoX.app/PlugIns/PovoXWidget.appex
          fi
          codesign -f -s - --entitlements PovoX/Support/PovoX.entitlements Payload/PovoX.app
          codesign -d --entitlements - Payload/PovoX.app 2>/dev/null | head -20 || true
          zip -qry povoX.ipa Payload
          # ウィジェットなし版(App Group が使えない署名方法向け): 拡張も App Group の権限も持たない
          rm -rf Payload/PovoX.app/PlugIns
          # --entitlements を付けないと前の権限が残るので、空の権限で署名し直す
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict/></plist>' > /tmp/empty.entitlements
          codesign -f -s - --entitlements /tmp/empty.entitlements Payload/PovoX.app
          if codesign -d --entitlements - Payload/PovoX.app 2>/dev/null | grep -q application-groups; then
            echo "::error::ウィジェットなし版に App Group の権限が残っています"; exit 1
          fi
          zip -qry povoX-nowidget.ipa Payload
          ls -lh *.ipa

      - name: Check IPAs
        id: macho_ipa
        run: |
          set -o pipefail
          python3 tools/check-macho.py --platform ios --expect-plugins 1 ios/povoX.ipa | tee ci/macho-ipa.txt
          python3 tools/check-macho.py --platform ios --expect-plugins 0 ios/povoX-nowidget.ipa | tee -a ci/macho-ipa.txt

      - name: Launch Release build in simulator (build files hidden)
        id: smoke
        working-directory: ios
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # 実機に入れるのと同じリリース構成でシミュレータ版を作り、テスト用の起動オプションなしで起動する。
          # 起動の前にビルドに使ったファイル(core/target と RustLib)を隠し、アプリがそれに頼っていないことも確かめる。
          set +e
          xcodebuild build -project PovoX.xcodeproj -scheme PovoX -configuration Release \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build/simrel \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY="-" > ../ci/build-simrel.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" ../ci/build-simrel.log | tail -40
          [ $status -eq 0 ] || exit $status
          set -e -o pipefail
          APP=build/simrel/Build/Products/Release-iphonesimulator/PovoX.app
          python3 ../tools/check-macho.py --platform iossim --expect-plugins 1 "$APP" | tee ../ci/macho-simrel.txt
          restore() {
            [ -d ../core/target.hidden ] && mv ../core/target.hidden ../core/target
            [ -d RustLib.hidden ] && mv RustLib.hidden RustLib
            return 0
          }
          trap restore EXIT
          mv ../core/target ../core/target.hidden
          mv RustLib RustLib.hidden
          xcrun simctl terminate "$UDID" jp.povox.app 2>/dev/null || true
          xcrun simctl uninstall "$UDID" jp.povox.app 2>/dev/null || true
          marker=$(mktemp); sleep 1
          xcrun simctl install "$UDID" "$APP"
          out=$(xcrun simctl launch "$UDID" jp.povox.app 2>&1) || { echo "$out"; echo "::error::起動できませんでした"; exit 1; }
          echo "$out"
          pid=${out##*: }
          sleep 12
          alive=0
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then alive=1; fi
          mkdir -p ../ci/shots ../ci/crash
          xcrun simctl io "$UDID" screenshot ../ci/shots/release-launch.png || true
          crashes=$(find ~/Library/Logs/DiagnosticReports -newer "$marker" -iname "*PovoX*" -type f 2>/dev/null || true)
          xcrun simctl terminate "$UDID" jp.povox.app 2>/dev/null || true
          echo "pid=$pid alive=$alive"
          if [ "$alive" != 1 ] || [ -n "$crashes" ]; then
            for f in $crashes; do cp "$f" ../ci/crash/; head -80 "$f"; done
            echo "::error::リリース構成のアプリが起動直後に終了しました"
            exit 1
          fi
          echo "リリース構成のアプリは 12 秒たっても動いています"

      - name: Collect test report
        if: always()
        run: |
          mkdir -p ci
          if [ -d ci/TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path ci/TestResults.xcresult > ci/test-summary.json 2>/dev/null || true
            xcrun xcresulttool get test-results tests --path ci/TestResults.xcresult > ci/test-tests.json 2>/dev/null || true
          fi
          grep -E "error:|failed|Test Case|XCTAssert|見つからない" ci/test.log > ci/test-key-lines.txt 2>/dev/null || true
          # シミュレータでアプリが落ちたときのクラッシュレポート
          mkdir -p ci/crash
          find ~/Library/Logs/DiagnosticReports -newer ios/project.yml \( -iname "*PovoX*" -o -iname "*povox*" \) -type f -exec cp {} ci/crash/ \; 2>/dev/null || true
          if [ -d ci/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ci/TestResults.xcresult --output-path ci/xcattach > /dev/null 2>&1 || true
            find ci/xcattach -type f \( -iname "*crash*" -o -iname "*.ips" -o -iname "*.txt" \) -exec cp {} ci/crash/ \; 2>/dev/null || true
          fi
          ls -la ci/crash || true
          grep -E "error:" ci/build-device.log > ci/build-errors.txt 2>/dev/null || true
          grep -E "error:" ci/build-simrel.log >> ci/build-errors.txt 2>/dev/null || true
          ls -la ci ci/shots 2>/dev/null | head -80

      - name: Publish screenshots and logs (ci-artifacts branch)
        if: always()
        run: |
          rm -rf /tmp/ci-out && mkdir -p /tmp/ci-out
          cp -R ci/shots /tmp/ci-out/ 2>/dev/null || true
          cp ci/*.txt ci/*.json /tmp/ci-out/ 2>/dev/null || true
          cp -R ci/crash /tmp/ci-out/ 2>/dev/null || true
          tail -c 3000000 ci/test.log > /tmp/ci-out/test.log 2>/dev/null || true
          tail -c 2000000 ci/build-device.log > /tmp/ci-out/build-device.log 2>/dev/null || true
          tail -c 1000000 ci/build-simrel.log > /tmp/ci-out/build-simrel.log 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/ci-out/SHA
          echo "test=${{ steps.test.outcome }} device=${{ steps.device.outcome }} macho=${{ steps.macho_device.outcome }}/${{ steps.macho_ipa.outcome }} release-launch=${{ steps.smoke.outcome }}" > /tmp/ci-out/STATUS
          cd /tmp/ci-out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI artifacts for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: povoX-ipa
          path: |
            ios/povoX.ipa
            ios/povoX-nowidget.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: ci/shots
          if-no-files-found: ignore

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          NOTE="未署名の IPA です。Sideloadly などで自分の Apple ID で署名して入れてください。
          - povoX.ipa: ウィジェット付き
          - povoX-nowidget.ipa: ウィジェットなし(署名ツールが App Group / 拡張機能に対応していないとき)
          シミュレータのテスト: ${{ steps.test.outcome }}
          検査: アプリが読み込むライブラリはすべて iOS かアプリの中のもの / リリース構成での起動 OK
          commit ${GITHUB_SHA::7}"
          FLAGS="--latest"
          if [ "${{ steps.test.outcome }}" != "success" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" ios/povoX.ipa ios/povoX-nowidget.ipa --title "povoX build ${GITHUB_RUN_NUMBER}" --notes "$NOTE" --target "${GITHUB_SHA}" $FLAGS

      - name: Fail if tests failed
        if: steps.test.outcome != 'success'
        run: |
          echo "::error::シミュレータのテストが失敗しました。ci-artifacts ブランチの test-key-lines.txt を見てください。"
          exit 1
